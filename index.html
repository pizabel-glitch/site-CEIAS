<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEIAS - Calendário & Grade Escolar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header class="section-header">
      <span class="badge-tag">✦ Gestão Escolar & Atividades</span>
      <h1 class="section-title">Calendário & <span>Grade Curricular</span></h1>
      <p class="section-description">
        Acompanhe as matérias, professores responsáveis e eventos programados no CEIAS.
      </p>
    </header>

    <div class="events-grid-layout">
      <!-- Calendário -->
      <section class="calendar-card">
        <div class="calendar-header">
          <h2 class="calendar-month" id="calendar-month-year">Outubro 2026</h2>
          <div class="calendar-nav">
            <button class="btn-icon" id="prev-month">‹</button>
            <button class="btn-icon" id="next-month">›</button>
          </div>
        </div>

        <div class="calendar-weekdays">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>

        <div class="calendar-days" id="calendar-days-grid"></div>
      </section>

      <!-- Lista de Eventos e Aulas -->
      <section class="events-list-wrapper">
        <div class="filters-bar">
          <button class="filter-btn active" data-filter="Todos">Todos</button>
          <button class="filter-btn" data-filter="Especial">Especiais</button>
          <button class="filter-btn" data-filter="Cultura">Cultura</button>
          <button class="filter-btn" data-filter="Escolar">Escolar</button>
        </div>

        <div class="events-cards-container" id="events-list"></div>
      </section>
    </div>
  </main>

  <!-- Modal de Detalhes -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
